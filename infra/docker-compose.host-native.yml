services:
  control-api:
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - worker-wife
      - worker-shared-1
    environment:
      HOST_CONTROLLER_BASE_URL: http://host.docker.internal:4040
      HOST_CONTROLLER_TOKEN: local-host-controller-token
      NODE_OPTIONS: --dns-result-order=ipv4first
      WORKER_DEFINITIONS: >-
        [
          {"workerId":"dad","displayName":"Dad","containerName":"host-dad","profilePath":"D:/OpenAi/infra/data/host-profiles/dad","agentBaseUrl":"http://host.docker.internal:4021","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"wife","displayName":"Wife","containerName":"host-wife","profilePath":"D:/OpenAi/infra/data/host-profiles/wife","agentBaseUrl":"http://host.docker.internal:4022","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"shared-1","displayName":"Shared 1","containerName":"host-shared-1","profilePath":"D:/OpenAi/infra/data/host-profiles/shared-1","agentBaseUrl":"http://host.docker.internal:4023","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"shared-2","displayName":"Shared 2","containerName":"host-shared-2","profilePath":"D:/OpenAi/infra/data/host-profiles/shared-2","agentBaseUrl":"http://host.docker.internal:4024","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"shared-3","displayName":"Shared 3","containerName":"host-shared-3","profilePath":"D:/OpenAi/infra/data/host-profiles/shared-3","agentBaseUrl":"http://host.docker.internal:4025","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"shared-4","displayName":"Shared 4","containerName":"host-shared-4","profilePath":"D:/OpenAi/infra/data/host-profiles/shared-4","agentBaseUrl":"http://host.docker.internal:4026","runtimeType":"host","defaultStatus":"starting"},
          {"workerId":"shared-5","displayName":"Shared 5","containerName":"host-shared-5","profilePath":"D:/OpenAi/infra/data/host-profiles/shared-5","agentBaseUrl":"http://host.docker.internal:4027","runtimeType":"host","defaultStatus":"starting"}
        ]
