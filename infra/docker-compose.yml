version: "3.9"

services:
  control-api:
    image: node:22-bookworm
    container_name: control-api
    working_dir: /app
    command: >
      sh -c "npm install --prefix services/control-api &&
      npm run dev --prefix services/control-api"
    environment:
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: "4010"
      SESSION_DB_PATH: /srv/chatgpt-workers/control-api/session-routing.sqlite
      SESSION_DURATION_MINUTES: "60"
      SESSION_SWEEP_INTERVAL_MS: "5000"
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      WORKER_HEALTH_POLL_INTERVAL_MS: "5000"
      WORKER_HEALTH_TIMEOUT_MS: "3000"
      WORKER_DEFINITIONS: >-
        [
          {"workerId":"dad","displayName":"Dad","containerName":"worker-dad","profilePath":"/srv/chatgpt-workers/profiles/dad","agentBaseUrl":"http://worker-dad:4020","defaultStatus":"starting"},
          {"workerId":"wife","displayName":"Wife","containerName":"worker-wife","profilePath":"/srv/chatgpt-workers/profiles/wife","agentBaseUrl":"http://worker-wife:4020","defaultStatus":"starting"},
          {"workerId":"shared-1","displayName":"Shared 1","containerName":"worker-shared-1","profilePath":"/srv/chatgpt-workers/profiles/shared-1","agentBaseUrl":"http://worker-shared-1:4020","defaultStatus":"starting"}
        ]
    ports:
      - "4010:4010"
    volumes:
      - ../:/app
      - ./data/control-api:/srv/chatgpt-workers/control-api
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - worker-dad
      - worker-wife
      - worker-shared-1
    networks:
      - worker-net

  session-client:
    image: node:22-bookworm
    container_name: session-client
    working_dir: /app
    command: >
      sh -c "npm install --prefix apps/session-client &&
      npm run dev --prefix apps/session-client -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_PROXY_TARGET: http://control-api:4010
    ports:
      - "4173:4173"
    volumes:
      - ../:/app
    depends_on:
      - control-api
    networks:
      - worker-net

  worker-dad:
    image: node:22-bookworm
    container_name: worker-dad
    working_dir: /app
    command: >
      sh -c "npm install --prefix workers/agent &&
      npm run dev --prefix workers/agent"
    environment:
      WORKER_ID: dad
      WORKER_DISPLAY_NAME: Dad
      WORKER_CONTAINER_NAME: worker-dad
      WORKER_AGENT_HOST: 0.0.0.0
      WORKER_AGENT_PORT: "4020"
      WORKER_PROFILE_PATH: /srv/chatgpt-workers/profiles/dad
    shm_size: 1gb
    tty: true
    volumes:
      - ../:/app
      - ./data/profiles/dad:/srv/chatgpt-workers/profiles/dad
    networks:
      - worker-net

  worker-wife:
    image: node:22-bookworm
    container_name: worker-wife
    working_dir: /app
    command: >
      sh -c "npm install --prefix workers/agent &&
      npm run dev --prefix workers/agent"
    environment:
      WORKER_ID: wife
      WORKER_DISPLAY_NAME: Wife
      WORKER_CONTAINER_NAME: worker-wife
      WORKER_AGENT_HOST: 0.0.0.0
      WORKER_AGENT_PORT: "4020"
      WORKER_PROFILE_PATH: /srv/chatgpt-workers/profiles/wife
    shm_size: 1gb
    tty: true
    volumes:
      - ../:/app
      - ./data/profiles/wife:/srv/chatgpt-workers/profiles/wife
    networks:
      - worker-net

  worker-shared-1:
    image: node:22-bookworm
    container_name: worker-shared-1
    working_dir: /app
    command: >
      sh -c "npm install --prefix workers/agent &&
      npm run dev --prefix workers/agent"
    environment:
      WORKER_ID: shared-1
      WORKER_DISPLAY_NAME: Shared 1
      WORKER_CONTAINER_NAME: worker-shared-1
      WORKER_AGENT_HOST: 0.0.0.0
      WORKER_AGENT_PORT: "4020"
      WORKER_PROFILE_PATH: /srv/chatgpt-workers/profiles/shared-1
    shm_size: 1gb
    tty: true
    volumes:
      - ../:/app
      - ./data/profiles/shared-1:/srv/chatgpt-workers/profiles/shared-1
    networks:
      - worker-net

networks:
  worker-net:
    internal: true
