#
# phase25-live-fix-backport-v1
# Canonical public path: Ubuntu nginx -> 127.0.0.1:4010
#
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 77.66.186.75 _;

  client_max_body_size 1m;

  location = /healthz {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location /api/relay/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location / {
    add_header Cache-Control no-store;
    return 404;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name 77.66.186.75 _;

  ssl_certificate /etc/nginx/ssl/ascii-art/selfsigned.crt;
  ssl_certificate_key /etc/nginx/ssl/ascii-art/selfsigned.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:OWMCGPSSL:10m;
  ssl_prefer_server_ciphers off;

  client_max_body_size 1m;

  location = /healthz {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location /api/relay/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host 77.66.186.75;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location / {
    add_header Cache-Control no-store;
    return 404;
  }
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  client_max_body_size 1m;

  location = /healthz {
    add_header Content-Type text/plain;
    add_header Cache-Control no-store;
    return 200 "ok\n";
  }

  location /api/relay/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location /v1/ {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 190s;
    proxy_read_timeout 190s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control no-store;
  }

  location / {
    add_header Cache-Control no-store;
    return 404;
  }
}
